<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="./CSS/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="./JS/contact.js" defer></script>
</head>

<body>

    <h1 class="contact-title">Contact Us</h1>
    <div class="container">
        <div class="post">
            <div class="text">Thanks for rating us!</div>
            <div class="edit">Edit</div>
        </div>
        <div class="star-widget">
            <input type="radio" name="rate" id="rate-5">
            <label for="rate-5" class="fas fa-star"></label>
            <input type="radio" name="rate" id="rate-4">
            <label for="rate-4" class="fas fa-star"></label>
            <input type="radio" name="rate" id="rate-3">
            <label for="rate-3" class="fas fa-star"></label>
            <input type="radio" name="rate" id="rate-2">
            <label for="rate-2" class="fas fa-star"></label>
            <input type="radio" name="rate" id="rate-1">
            <label for="rate-1" class="fas fa-star"></label>
            <form action="#">
                <header></header>
                <div class="text-area">
                    <textarea cols="30" placeholder="Describe your experience..."></textarea>
                </div>
                <div class="btn">
                    <button type="submit">Post</button>
                </div>
            </form>
        </div>
    </div>
    <div class="address-line">
        <p>
            Phone <i class="fa-solid fa-phone"></i>: +1 920041
            <br>Cell Phone <i class="fa-solid fa-mobile"></i>: 0315-554467
            <br>WhatsApp <i class="fa-brands fa-whatsapp"></i>: 0315-554467
            <br>Email <i class="fa-solid fa-envelope"></i>: aliwaqas701@yahoo.com
            <br>Address <i class="fa-solid fa-house"></i>: 3601, S Gaffey St., Los Angeles, California.
        </p>

    </div>
    <h3 class="copy-rights">&copy; <img src="./CSS/Images/logo.png" width="30"> Brewed with passion and delicacy by
        Waqas Ali</h3>
</body>

</html>
